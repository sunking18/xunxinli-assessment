# 寻心理测评平台 - Docker Compose 部署（q.xunxinli.com）
# 注意：
#  - 服务器 80/443 由另一套系统的 survey-nginx 容器（/data/MCsurvey-docker）占用，
#    它是 xunxinli.com / survey.xunxinli.com 的总网关，不能停。
#  - 因此本前端容器映射到宿主机 0.0.0.0:8080，
#    由 survey-nginx 容器反代 q.xunxinli.com → 172.17.0.1:8080。
#  - 数据库使用 compose 自带 MySQL 容器（独立隔离，数据存 volume mysql_data），
#    与服务器其他项目的 MySQL 互不影响。首次部署执行
#    docker compose exec server npx prisma db push 建表。
# 使用: docker compose up -d --build
version: "3.8"

services:
  # MySQL 数据库（独立容器，与服务器其他项目隔离）
  mysql:
    image: mysql:8.0
    container_name: xunxinli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xunxinli_root_2026}
      MYSQL_DATABASE: q_xunxinli
      MYSQL_USER: ${MYSQL_USER:-q_xunxinli}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xunxinli123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化（数据目录为空时）自动按文件名顺序执行 initdb/*.sql。
      # 业务数据（测评定义/题目/报告模板/管理员等）全部由 SQL 提供，
      # 后端不再执行 prisma db seed。修改数据请编辑对应 SQL 或手动导入。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # 宿主机侧用 3307（避开本机 MySQL 占用的 3306），容器内部仍为 3306，
    # server 通过容器网络 mysql:3306 连接，不受此映射影响。
    # ⚠️ 暴露到公网存在爆破风险，务必：
    #   1) 使用强密码（.env 的 MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD）
    #   2) 在云厂商安全组 + 系统防火墙仅放行可信来源 IP
    #   3) 不需要外网访问时改回 "127.0.0.1:3307:3306"
    ports:
      - "0.0.0.0:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-xunxinli123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 后端 API
  server:
    build: ./server
    container_name: xunxinli-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-q_xunxinli}:${MYSQL_PASSWORD:-xunxinli123}@mysql:3306/q_xunxinli
      JWT_SECRET: ${JWT_SECRET:-xunxinli-assessment-secret-change-me}
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:-https://q.xunxinli.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://q.xunxinli.com}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      DEV_SKIP_WECHAT: ${DEV_SKIP_WECHAT:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    # 宿主机侧用 3011（原 3001 被服务器上其他进程长期占用，无法释放），
    # 容器内部仍为 3001，server 代码/PORT 环境变量无需改动。
    # survey-nginx 内配置需同步改为：proxy_pass http://172.17.0.1:3011;
    # ⚠️ 暴露 3011 存在风险，建议防火墙限制仅允许 survey-nginx / 可信来源访问。
    ports:
      - "0.0.0.0:3011:3001"

  # 前端（Nginx）
  client:
    build: ./client
    container_name: xunxinli-client
    restart: unless-stopped
    depends_on:
      - server
    # 8080 供 survey-nginx 容器反代（该容器是 xunxinli.com / survey.xunxinli.com 的总网关）。
    # 不能只绑 127.0.0.1，否则 survey-nginx 容器（跨网络）访问不到；
    # 绑 0.0.0.0 保证连通，建议用防火墙限制 8080 只对本机/内网开放。
    ports:
      - "0.0.0.0:8080:80"

volumes:
  mysql_data:

